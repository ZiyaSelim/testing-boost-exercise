name: SSE CI/CD

on:
  push:
    branches:
      - main
      - extend-tests
  pull_request:
    branches:
      - main
      - extend-tests

jobs:
  style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Verify Formatting
        run: |
          find src tests -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev libboost-test-dev libyaml-cpp-dev
      - name: Configure and Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: testsidemade-binary
          path: build/testsidemade

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev libboost-test-dev libyaml-cpp-dev
      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: testsidemade-binary
          path: .
      - name: Run Tests
        run: |
          chmod +x build/testsidemade
          ./build/testsidemade
